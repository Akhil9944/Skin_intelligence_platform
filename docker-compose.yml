version: '3.8'

services:
  # PostgreSQL: For relational data like Users and Roles
  postgres:
    image: postgres:15
    container_name: skin_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: skin_intelligence
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB: For flexible, document-based data like Skin Profiles
  mongodb:
    image: mongo:6.0
    container_name: skin_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Redis: For caching and fast background task processing
  redis:
    image: redis:7.0
    container_name: skin_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongodb_data: